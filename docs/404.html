<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Juniper Family Chiropractic</title>
    <script>
      // GitHub Pages SPA redirect: encode the current URL into a query param
      // and redirect to the root so Angular's router can handle it.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/?p=' + encodeURIComponent(l.pathname.slice(1) + l.search) +
        (l.hash ? l.hash : '')
      );
    </script>
  </head>
  <body></body>
</html>
