<section class="page-section">
  <h1>New Patients</h1>
  <p class="intro">Everything you need for a smooth first visit.</p>

  @if (isLoading()) {
    <p class="loading">Loading common questions...</p>
  } @else {
    <div class="faq-list">
      @for (faq of faqs(); track faq.question) {
        <details open>
          <summary>{{ faq.question }}</summary>
          <p>{{ faq.answer }}</p>
        </details>
      }
    </div>
  }
</section>
