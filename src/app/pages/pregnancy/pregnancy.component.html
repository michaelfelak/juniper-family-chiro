<section class="page-section">
  <h1>Pregnancy Care</h1>
  <p class="intro">
    Gentle, trimester-aware chiropractic support for comfort, mobility, and confidence.
  </p>

  @if (isLoading()) {
    <p class="loading">Loading prenatal services...</p>
  } @else {
    <div class="service-grid">
      @for (service of services(); track service.title) {
        <article>
          <p class="audience">{{ service.audience }}</p>
          <h2>{{ service.title }}</h2>
          <p>{{ service.description }}</p>
        </article>
      }
    </div>
  }
</section>
