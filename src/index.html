<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Juniper Family Chiropractic</title>
    <base href="/juniper-family-chiro/" />
    <script>
      // GitHub Pages SPA: restore the original URL encoded by 404.html
      (function () {
        var p = window.location.search.match(/[?&]p=([^&]*)/);
        if (p) {
          var path = decodeURIComponent(p[1]);
          // Strip the repo prefix if present so Angular router sees the correct path
          path = path.replace(/^juniper-family-chiro\//, '');
          window.history.replaceState(
            null, null,
            '/' + 'juniper-family-chiro/' + path
          );
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
